name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"

      - name: Wait for deploy
        run: sleep 60

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_API_URL }}/api/categories")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"

      - name: Trigger revalidation
        run: |
          curl -X POST "${{ secrets.PROD_FRONTEND_URL }}/api/revalidate" \
            -H "Content-Type: application/json" \
            -H "x-revalidation-secret: ${{ secrets.REVALIDATION_SECRET }}" \
            -d '{"tag": "products"}'

  deploy-frontend:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Vercel Deploy
        run: |
          curl -X POST "${{ secrets.VERCEL_PROD_DEPLOY_HOOK }}"

      - name: Wait for deploy
        run: sleep 90

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_FRONTEND_URL }}")
          if [ "$STATUS" != "200" ]; then
            echo "Frontend health check failed with status $STATUS"
            exit 1
          fi
          echo "Frontend health check passed"
